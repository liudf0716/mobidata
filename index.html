<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBD Industrial Router | 5G/4G + WiFi 6 + GPS</title>
  <link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.jpg" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.jpg" />
  <link rel="icon" type="image/jpeg" sizes="192x192" href="icon-192.jpg" />
  <style>
    :root {
      --bg: #07111e;
      --bg-soft: #0d1d31;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(255, 255, 255, 0.1);
      --text: #ecf7ff;
      --muted: #a9c4db;
      --primary: #33c7ff;
      --primary-2: #1f9ef8;
      --line: rgba(255, 255, 255, 0.13);
      --success: #70e08f;
      --pink: #f062b8;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 10% 10%, #1b4464 0%, transparent 35%),
        radial-gradient(circle at 90% 15%, #1f3658 0%, transparent 28%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-soft) 100%);
      color: var(--text);
      font-family: "Noto Sans SC", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: #9ee8ff;
      text-decoration: none;
      border-bottom: 1px dashed rgba(158, 232, 255, 0.5);
    }

    .container {
      width: min(1220px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 99;
      backdrop-filter: blur(10px);
      background: rgba(6, 14, 26, 0.8);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .4px;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.3);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .product-tabs {
      display: inline-flex;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .2s ease;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      color: var(--text);
      background: rgba(51, 199, 255, .14);
    }

    .chip {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .chip-5g { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .chip-4g { background: linear-gradient(135deg, #60a5fa, #2563eb); }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      min-width: 48px;
    }

    .lang-btn.active {
      color: var(--text);
      background: rgba(51, 199, 255, .14);
    }

    .hero {
      padding: 54px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .hero-logo {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 0 25px rgba(51, 199, 255, .2);
      object-fit: cover;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.14;
      letter-spacing: .3px;
    }

    .hero p {
      margin: 0;
      font-size: clamp(16px, 1.5vw, 20px);
      color: var(--muted);
      max-width: 980px;
    }

    .tags {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      background: rgba(255,255,255,.03);
    }

    .intro-note {
      margin-top: 24px;
      background: linear-gradient(135deg, rgba(51,199,255,.12), rgba(31,158,248,.04));
      border: 1px solid rgba(51, 199, 255, .35);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    section {
      margin-top: 34px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 24px;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .gallery-wrap {
      padding: 24px;
    }

    .gallery-main {
      text-align: center;
      margin-bottom: 18px;
    }

    .gallery-main img {
      max-width: 100%;
      max-height: 460px;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(0,0,0,.5);
    }

    .thumbnails {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .thumbnails img {
      width: 88px;
      height: 88px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid transparent;
      opacity: .65;
      cursor: pointer;
      transition: all .2s ease;
    }

    .thumbnails img.active,
    .thumbnails img:hover {
      border-color: var(--primary);
      opacity: 1;
      transform: translateY(-3px);
    }

    .cards-2,
    .cards-3,
    .cards-4 {
      display: grid;
      gap: 14px;
    }

    .cards-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p,
    .card li {
      margin: 0;
      color: #d5e6f4;
      font-size: 14px;
    }

    ul { margin: 10px 0 0; padding-left: 18px; }
    li { margin-bottom: 6px; }

    .hardware-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      align-items: stretch;
    }

    .hardware-image {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .hardware-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
    }

    .spec-table th,
    .spec-table td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }

    .spec-table th {
      width: 220px;
      color: var(--muted);
      font-weight: 600;
      background: rgba(255,255,255,.03);
    }

    .spec-table tr:last-child th,
    .spec-table tr:last-child td {
      border-bottom: 0;
    }

    .highlight-row td,
    .highlight-row th {
      background: rgba(51,199,255,.08);
    }

    .diff {
      display: inline-block;
      margin-left: 7px;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      color: white;
      font-weight: 700;
    }

    .diff-5g { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .diff-4g { background: linear-gradient(135deg, #60a5fa, #2563eb); }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cta {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06243a;
      font-weight: 700;
      margin-right: 8px;
      margin-top: 8px;
    }

    footer {
      margin-top: 42px;
      border-top: 1px solid var(--line);
      padding: 28px 0 38px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .cards-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hardware-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .container { width: min(1220px, calc(100% - 24px)); }
      .topbar-inner { flex-direction: column; align-items: stretch; }
      .controls { justify-content: flex-start; }
      .cards-2, .cards-3, .cards-4, .contact-grid { grid-template-columns: 1fr; }
      .hero { padding-top: 30px; }
      .hero-logo { width: 54px; height: 54px; }
      .section-title { font-size: 22px; }
      .spec-table th { width: 130px; }
      .thumbnails img { width: 72px; height: 72px; }
    }
  </style>
</head>

    const viewLabels = {
      zh: ['正面视图 - 指示灯与品牌标识', '侧面视图 - 紧凑金属外壳', '接口视图 - 丰富工业接口', '底部视图 - 散热与安装结构'],
      en: ['Front View - LEDs and branding', 'Side View - Compact metal enclosure', 'Port View - Rich industrial interfaces', 'Bottom View - Thermal and mounting structure']
    };

    let currentLang = localStorage.getItem('mobidata_lang') || 'zh';
    let currentProduct = 'r650l';
    let autoplay = null;
    let currentIndex = 0;

    function text(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || key;
    }

    function applyI18n() {
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = text(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-html]').forEach((el) => {
        el.innerHTML = text(el.dataset.i18nHtml);
      });
      document.querySelectorAll('[data-view-label]').forEach((el) => {
        const index = Number(el.dataset.viewLabel);
        el.textContent = getViewLabel(index);
      });
      document.getElementById('footer-text').textContent = text('footer');
      document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');
      document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
      document.title = currentLang === 'zh'
        ? 'MBD 工业级路由器 | 5G/4G + WiFi 6 + GPS'
        : 'MBD Industrial Router | 5G/4G + WiFi 6 + GPS';
    }

    function getViewLabel(index) {
      const labels = viewLabels[currentLang] || [];
      if (labels[index]) return labels[index];
      return currentLang === 'zh' ? `产品视图 ${index + 1}` : `Product View ${index + 1}`;
    }

    function buildGallery(basePath, images) {
      const thumbsWrap = document.getElementById('gallery-thumbnails');
      thumbsWrap.innerHTML = images.map((file, index) => {
        const src = `${basePath}/${file}`;
        const activeClass = index === 0 ? 'active' : '';
        return `<img src="${src}" alt="thumb ${index + 1}" class="${activeClass}" data-index="${index}" />`;
      }).join('');
    }

    function buildViews(basePath, images) {
      const cardsWrap = document.getElementById('view-cards');
      cardsWrap.innerHTML = images.map((file, index) => {
        const src = `${basePath}/${file}`;
        return `<article class="card"><img src="${src}" alt="view ${index + 1}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px;" /><h3 data-view-label="${index}">${getViewLabel(index)}</h3></article>`;
      }).join('');
    }

    function renderProduct() {
      const p = products[currentProduct];

      document.querySelectorAll('.tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.product === currentProduct);
      });

      document.getElementById('tag-network').textContent = p.network;
      document.getElementById('product-title').textContent = p.title[currentLang];
      document.getElementById('product-desc').textContent = p.desc[currentLang];
      document.getElementById('modem-title').textContent = p.modemTitle[currentLang];
      document.getElementById('modem-desc').textContent = p.modemDesc[currentLang];
      document.getElementById('cellular-card-title').textContent = p.cellularTitle[currentLang];
      document.getElementById('cellular-card-list').innerHTML = p.cellularList[currentLang];
      document.getElementById('spec-model').innerHTML = p.specModel[currentLang];
      document.getElementById('spec-cellular').innerHTML = p.specCellular[currentLang];

      const basePath = p.imagePath;
      const images = p.galleryImages;
      const main = document.getElementById('main-image');
      main.src = `${basePath}/${images[0]}`;

      buildGallery(basePath, images);
      buildViews(basePath, images);

      document.getElementById('inner-image').src = `${basePath}/inner.png`;
      currentIndex = 0;
      restartAutoplay();
    }

    function setMainImage(imgEl) {
      document.getElementById('main-image').src = imgEl.src;
      document.querySelectorAll('#gallery-thumbnails img').forEach((img) => img.classList.remove('active'));
      imgEl.classList.add('active');
    }

    function restartAutoplay() {
      if (autoplay) clearInterval(autoplay);
      autoplay = setInterval(() => {
        const thumbs = document.querySelectorAll('#gallery-thumbnails img');
        if (!thumbs.length) return;
        currentIndex = (currentIndex + 1) % thumbs.length;
        setMainImage(thumbs[currentIndex]);
      }, 5000);
    }

    function bindEvents() {
      document.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (currentProduct === btn.dataset.product) return;
          currentProduct = btn.dataset.product;
          renderProduct();
        });
      });

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (currentLang === btn.dataset.lang) return;
          currentLang = btn.dataset.lang;
          localStorage.setItem('mobidata_lang', currentLang);
          applyI18n();
          renderProduct();
        });
      });

      document.getElementById('gallery-thumbnails').addEventListener('click', (event) => {
        const thumb = event.target.closest('img[data-index]');
        if (!thumb) return;
        currentIndex = Number(thumb.dataset.index);
        setMainImage(thumb);
        restartAutoplay();
      });
    }

    applyI18n();
    bindEvents();
    renderProduct();
  </script>
